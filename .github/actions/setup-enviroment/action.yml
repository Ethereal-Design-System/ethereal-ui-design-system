name: 'Setup Environment'
description: 'Configure the Node version and install the dependencies'

inputs:
  custom_token:
    description: 'Custom GitHub for the checkout'
    required: false

runs:
  using: 'composite'
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: 'npm'

    - name: Install dependencies
      shell: bash
      run: npm install
