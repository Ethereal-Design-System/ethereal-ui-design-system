name: Check Changeset

on:
  pull_request:
    branches:
      - develop
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.vscode/**'
      - '.github/workflows/**'

jobs:
  validate-changeset:
    name: Verify Changelog File
    runs-on: ubuntu-latest
    steps:
      - name: Setup Environment
        uses: ./.github/actions/setup-enviroment
        with:
          custom_token: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Validate the existence of Changeset

        run: npx changeset status --since=origin/develop
